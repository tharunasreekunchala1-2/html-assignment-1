<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>

<body>

<center>

<form>

<table border="1" cellpadding="10" cellspacing="0">

<tr>
    <th colspan="2"><h2>Registration Form</h2></th>
</tr>

<tr>
    <td>Student Name</td>
    <td><input type="text"></td>
</tr>

<tr>
    <td>Father's Name</td>
    <td><input type="text"></td>
</tr>

<tr>
    <td>Mother's Name</td>
    <td><input type="text"></td>
</tr>

<tr>
    <td>Date of Birth</td>
    <td><input type="date"></td>
</tr>

<tr>
    <td>Gender</td>
    <td>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
    </td>
</tr>

<tr>
    <td>Email ID</td>
    <td><input type="email"></td>
</tr>

<tr>
    <td>Mobile No.</td>
    <td><input type="text"></td>
</tr>

<tr>
    <td>Address</td>
    <td><textarea rows="4" cols="30"></textarea></td>
</tr>

<tr>
    <td>State</td>
    <td><input type="text"></td>
</tr>

<tr>
    <td>City</td>
    <td><input type="text"></td>
</tr>

<tr>
    <td colspan="2" align="center">
        <input type="submit" value="Submit">
    </td>
</tr>

</table>

</form>

</center>

</body>
</html>
